repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (Python syntax check)
        entry: bash -c 'source .venv/bin/activate && ruff check'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        verbose: true

      - id: pyright
        name: pyright (Python type check)
        entry: bash -c 'source .venv/bin/activate && basedpyright'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        verbose: true

      - id: eslint
        name: eslint (JS/TS/Vue syntax check)
        entry: bash -c 'cd frontend && if test -d node_modules/@typescript-eslint; then npx eslint . --ext .vue,.js,.ts,.tsx --ignore-path .gitignore --max-warnings 80; else echo "⚠️  @typescript-eslint 未安装，跳过 eslint 检查"; fi'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: pytest
        name: pytest
        entry: bash -c 'source .venv/bin/activate && DATABASE_URL=postgres://geneticgrid:geneticgrid@localhost:5432/geneticgrid python -m pytest tests/ -q --no-header --ignore=tests/test_cache_service.py 2>&1 | tail -20'
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        verbose: true
